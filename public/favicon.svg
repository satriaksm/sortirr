<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="128" height="128" rx="32" fill="#090d16"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" fill-opacity="0.18" stroke="url(#bgGrad)" stroke-width="2.5"/>
  <!-- Modern Lightning / Sorter Bolt -->
  <path d="M72 18 L34 72 L62 72 L54 110 L94 56 L66 56 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
